name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Core unit tests exercise the pure logic (dedupe, fingerprint math,
      # pack matching, config, language cues) and deliberately avoid the
      # heavy model stack — install only what those imports need.
      - run: pip install numpy pyyaml pytest
      - run: pip install -e . --no-deps
      - run: pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      # Install the built wheel, not the checkout, into a clean environment with
      # only what importing moim_scribe.cli needs (the same set the unit job
      # installs): this catches files that exist in the repo but never reach the
      # package (templates, package data).
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install numpy pyyaml
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
      - name: Run the installed command
        run: '"$RUNNER_TEMP/wheel-venv/bin/moim-scribe" --version'
      - name: Check the templates are inside the installed package
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'EOF'
          from importlib.resources import files

          root = files("moim_scribe") / "templates"
          needed = [
              "lenses/summary.ko.md",
              "lenses/summary.en.md",
              "lenses/_common.ko.md",
              "lenses/_common.en.md",
              "examples/bookclub-demo/match.json",
          ]
          missing = [n for n in needed if not root.joinpath(n).is_file()]
          assert not missing, f"missing from the installed package: {missing}"
          print("templates present:", ", ".join(needed))
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned on purpose. Unpinned, this step installs whatever ruff released
      # most recently, so a push that changes nothing relevant turns the branch
      # red the day a new rule ships — which is what happened on 0.16.0, where
      # thirteen findings landed in code no commit had touched. Moving the pin
      # is then a deliberate change with those findings as its work item.
      - run: pip install ruff==0.16.1
      - run: ruff check src tests
