name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Core unit tests exercise the pure logic (dedupe, fingerprint math,
      # pack matching, config, language cues) and deliberately avoid the
      # heavy model stack — install only what those imports need.
      - run: pip install numpy pyyaml pytest
      - run: pip install -e . --no-deps
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned on purpose. Unpinned, this step installs whatever ruff released
      # most recently, so a push that changes nothing relevant turns the branch
      # red the day a new rule ships — which is what happened on 0.16.0, where
      # thirteen findings landed in code no commit had touched. Moving the pin
      # is then a deliberate change with those findings as its work item.
      - run: pip install ruff==0.16.1
      - run: ruff check src tests
